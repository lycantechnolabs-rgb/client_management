<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1040" width="800" height="1040" role="img" aria-label="Specimen document">
<defs>
    <filter id="sheet" x="-10%" y="-6%" width="120%" height="112%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#2e4a1c" flood-opacity="0.13"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
<rect width="800" height="1040" fill="#eae6d8"/>
<rect x="26" y="20" width="748" height="1000" rx="3" fill="#ffffff" filter="url(#sheet)"/>
<g transform="translate(400 520) rotate(-32)" opacity="0.085">
